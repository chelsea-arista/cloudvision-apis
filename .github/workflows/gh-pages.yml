name: github pages

on:
  push:
    branches:
      - trunk
    tags:
      - '**'

jobs:
  build-deploy:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@master
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Protoc
      uses: arduino/setup-protoc@master

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: 'stable'

    - name: Install protoc-gen-doc
      run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

    - name: Install dependencies
      working-directory: docs
      run: npm install

    - name: Create directory
      working-directory: docs/content
      run: mkdir -p models

    - name: Setup Git config
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Determine version information
      id: get_version
      run: |
        echo "::set-output name=ref_name::${{ github.ref_name }}"
        echo "::set-output name=ref_type::${{ github.ref_type }}"

    - name: Retrieve previous version files from gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! git clone --branch gh-pages https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} gh-pages-temp; then
          echo "Error: gh-pages branch not found!"
          exit 1
        fi
        if [ -f gh-pages-temp/versions.json ]; then
          cp gh-pages-temp/versions.json docs/
        fi
        if [ -d gh-pages-temp/versioned_docs ]; then
          cp -r gh-pages-temp/versioned_docs docs/
        fi
        if [ -d gh-pages-temp/versioned_sidebars ]; then
          cp -r gh-pages-temp/versioned_sidebars docs/
        fi

    - name: Generate Docs
      working-directory: docs
      run: make

    - name: Generate Versioned Docs
      if: steps.get_version.outputs.ref_type == 'tag'
      working-directory: docs
      run: |
        make version

    - name: Build Docusaurus Site
      working-directory: docs
      run: npx docusaurus build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./docs/build
        keep_files: true
