name: github pages

on:
  push:
    branches:
      - trunk
    tags:
      - '**'

jobs:
  build-deploy:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@master
      with:
        submodules: true

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Protoc
      uses: arduino/setup-protoc@master

    - name: Install Latest Golang
      uses: actions/setup-go@v4
      with:
        go-version: 'stable'

    - name: Install protoc-gen-doc
      run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

    - name: Install dependencies
      working-directory: docs
      run: npm install

    - name: Create directory
      working-directory: docs/content
      run: mkdir -p models

    - name: Setup Git config
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Determine new version tag
      id: get_version
      run: |
        LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)
        echo "Latest tag: $LATEST_TAG"
        if [ -z "$LATEST_TAG" ]; then
          NEW_TAG="v1.0.0"
        else
          MAJOR=$(echo "$LATEST_TAG" | sed -E 's/^v([0-9]+)\..*/\1/')
          NEW_MAJOR=$((MAJOR+1))
          NEW_TAG="v${NEW_MAJOR}.0.0"
        fi
        echo "New tag: $NEW_TAG"
        echo "::set-output name=new_tag::$NEW_TAG"

    - name: Create and push new tag
      run: |
        NEW_TAG=${{ steps.get_version.outputs.new_tag }}
        echo "Creating tag $NEW_TAG"
        git tag -a "$NEW_TAG" -m "Version $NEW_TAG"
        git push origin "$NEW_TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Retrieve previous version files from gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git clone --branch gh-pages https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} gh-pages-temp || echo "gh-pages branch not found"
        if [ -d gh-pages-temp ]; then
          if [ -f gh-pages-temp/versions.json ]; then
            cp gh-pages-temp/versions.json docs/
          fi
          if [ -d gh-pages-temp/versioned_docs ]; then
            cp -r gh-pages-temp/versioned_docs docs/
          fi
          if [ -d gh-pages-temp/versioned_sidebars ]; then
            cp -r gh-pages-temp/versioned_sidebars docs/
          fi
        fi

    - name: Generate Docs
      working-directory: docs
      run: make

    - name: Generate Versioned Docs
      working-directory: docs
      run: make version

    - name: Build Docusaurus Site
      working-directory: docs
      run: npx docusaurus build

    - name: Update version files in gh-pages branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git clone --branch gh-pages https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} gh-pages-temp || mkdir gh-pages-temp && cd gh-pages-temp && git init && git checkout -b gh-pages && cd ..
        cd gh-pages-temp
        if [ -f versions.json ]; then
          echo "Merging versions.json..."
          jq -s 'add | unique' versions.json ../docs/versions.json > tmp.json && mv tmp.json versions.json
        else
          cp ../docs/versions.json .
        fi
        if [ -d ../docs/versioned_docs ]; then
          mkdir -p versioned_docs
          cp -r ../docs/versioned_docs/* versioned_docs/
        fi
        if [ -d ../docs/versioned_sidebars ]; then
          mkdir -p versioned_sidebars
          cp -r ../docs/versioned_sidebars/* versioned_sidebars/
        fi
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "Update version files from build"
          git push origin gh-pages
        else
          echo "No version file changes."
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./docs/build
        keep_files: true