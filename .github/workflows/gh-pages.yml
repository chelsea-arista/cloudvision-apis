name: github pages

on:
  push:
    branches:
    - trunk

jobs:
  build-deploy:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Protoc
      uses: arduino/setup-protoc@master

    - name: Setup Go
      uses: actions/setup-go@v2
      with:
        go-version: '^1.17.6'

    - name: Install protoc-gen-doc
      run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

    - name: Install dependencies
      working-directory: docs
      run: npm install

    - name: Create directory
      working-directory: docs/content
      run: mkdir -p models

    - name: Build generate_versions tool
      working-directory: docs
      run: go build -o generate_markdown generate_markdown.go

    - name: Setup Git config
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Generate Docs
      working-directory: docs
      run: make

    - name: Ensure docs directory exists
      run: mkdir -p docs

    - name: Generate Versioned Docs
      working-directory: docs
      run: make version

    - name: Ensure version files exist
      run: |
        mkdir -p docs
        test -f docs/versions.json || echo '[]' > docs/versions.json
        test -f docs/versioned.json || echo '{}' > docs/versioned.json
        ls -l docs/

    - name: Copy versions.json to build directory
      run: cp docs/versions.json docs/versioned.json docs/build/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./docs/build
        keep_files: true
